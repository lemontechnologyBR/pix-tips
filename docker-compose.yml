services:

  # ── Banco de dados ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tippage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório em .env.production}
      POSTGRES_DB: tippage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tippage"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ── Aplicação Next.js + Socket.IO ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tippage:${POSTGRES_PASSWORD}@postgres:5432/tippage
      NEXT_PUBLIC_APP_URL: https://pix.tips
      NEXT_PUBLIC_SOCKET_URL: https://pix.tips
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads          # mídia pública (fallback sem S3)
      - private_uploads:/app/private/uploads # documentos KYC (fallback sem S3)
    networks:
      - backend
      - traefik_proxy   # rede externa do Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pixtips.rule=Host(`pix.tips`) || Host(`www.pix.tips`)"
      - "traefik.http.routers.pixtips.entrypoints=websecure"
      - "traefik.http.routers.pixtips.tls=true"
      - "traefik.http.routers.pixtips.tls.certresolver=letsencrypt"
      - "traefik.http.services.pixtips.loadbalancer.server.port=3000"
      # Redireciona www → apex
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.pix\\.tips/(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://pix.tips/$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.pixtips.middlewares=www-redirect"
      # WebSocket (Socket.IO)
      - "traefik.http.middlewares.pixtips-headers.headers.customrequestheaders.X-Forwarded-Proto=https"

networks:
  backend:
    internal: true
  traefik_proxy:
    external: true   # rede criada pelo Traefik no servidor

volumes:
  postgres_data:
  uploads:
  private_uploads:
